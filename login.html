<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnowBlaze | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --neon: #efef15;
            --pink: #53ef1a;
            --text: #ffffff;
            --glass: rgba(0, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            overflow: hidden;
            font-family: Poppins, sans-serif;
            color: var(--text);
            background:
                linear-gradient(var(--glass) 1px, transparent 1px),
                linear-gradient(90deg, var(--glass) 1px, transparent 1px),
                #050505;
            background-size: 40px 40px;
        }

        .login-card {
            width: min(420px, 100%);
            padding: 38px;
            border: 1px solid var(--glass);
            border-left: 4px solid var(--neon);
            border-radius: 4px;
            background: rgba(46, 46, 223, 0.92);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
        }

        .brand {
            margin-bottom: 8px;
            color: var(--neon);
            font-weight: 800;
            letter-spacing: 2px;
            text-align: center;
        }

        h1 {
            margin-bottom: 28px;
            text-align: center;
            font-size: 22px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon);
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 44px;
            border: 1px solid var(--glass);
            border-radius: 4px;
            outline: none;
            background: rgba(0, 0, 0, 0.35);
            color: white;
            font: inherit;
        }

        input:focus {
            border-color: var(--neon);
            box-shadow: 0 0 12px rgba(239, 239, 21, 0.25);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: none;
            color: var(--text);
            cursor: pointer;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 20px;
            font-size: 12px;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 0;
        }

        .options a,
        .back-link {
            color: var(--neon);
            text-decoration: none;
        }

        .submit-btn {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 4px;
            background: var(--neon);
            color: #000;
            font: 800 13px Poppins, sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.25s;
        }

        .submit-btn:hover {
            background: var(--pink);
            color: #000;
            box-shadow: 0 0 18px var(--pink);
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
        }

        .message {
            min-height: 20px;
            margin-top: 12px;
            text-align: center;
            color: #fff1a8;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">SNOWBLAZE.SYS</div>
        <h1>Secure Login</h1>

        <form id="loginForm">
            <div class="field">
                <label for="email">IDENTITY / EMAIL</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input id="email" name="email" type="email" placeholder="operator@example.com" autocomplete="email"
                        required>
                </div>
            </div>

            <div class="field">
                <label for="password">PASSWORD</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input id="password" name="password" type="password" placeholder="Enter password"
                        autocomplete="current-password" minlength="6" required>
                    <button class="password-toggle" type="button" id="passwordToggle" aria-label="Show password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="options">
                <label><input type="checkbox" name="remember"> Remember me</label>
                <a href="#" onclick="event.preventDefault(); alert('Password recovery is not configured yet.');">Forgot
                    password?</a>
            </div>

            <button class="submit-btn" type="submit">Start Uplink</button>
            <p class="message" id="message"></p>
        </form>

        <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Return to portfolio</a>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const password = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        const message = document.getElementById('message');

        passwordToggle.addEventListener('click', () => {
            const visible = password.type === 'text';
            password.type = visible ? 'password' : 'text';
            passwordToggle.innerHTML = visible
                ? '<i class="fa-solid fa-eye"></i>'
                : '<i class="fa-solid fa-eye-slash"></i>';
            passwordToggle.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
        });

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            message.textContent = 'ACCESS REQUEST ACCEPTED // DEMO MODE';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 700);
        });
    </script>
</body>

</html>
